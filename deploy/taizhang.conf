; ================================================================
; 亚德彩投标台账 · FastAPI 后端 Supervisor 配置（Linux 生产环境）
;
; 安装：
;   1. 按实际情况修改下方【必改】标记的 4 处：项目路径 / Python 路径 / 运行用户 / 端口
;   2. sudo cp taizhang.conf /etc/supervisor/conf.d/taizhang.conf
;      （CentOS/RHEL 为 /etc/supervisord.d/taizhang.ini）
;   3. sudo mkdir -p /var/log/taizhang && sudo chown -R taizhang:taizhang /var/log/taizhang
;   4. sudo supervisorctl reread && sudo supervisorctl update
;   5. sudo supervisorctl status taizhang      # 应显示 RUNNING
;
; 注意：
;   - 必须单进程（--workers 1）：数据存 SQLite，且代码内使用进程级锁与共享连接，
;     多 worker 会导致数据库锁冲突与数据不一致。
;   - 默认只监听 127.0.0.1，前端静态文件与对外入口由 Nginx 托管/反代（见文件末尾注释）。
;     若不用 Nginx、需内网直连 8000 端口，把 --host 改为 0.0.0.0 即可
;     （代码内置 SPA 兜底，直连时刷新页面不 404）。
;   - 运行用户对 server/ 目录必须有写权限（data.db 与 users.json 会原地更新）：
;       sudo chown -R taizhang:taizhang /opt/taizhang/server
; ================================================================

[program:taizhang]
; 【必改】项目根目录（server/ 的上级目录，uvicorn 以 server.main:app 模块方式加载）
directory=/opt/taizhang

; 【必改】虚拟环境 Python 路径；--host/--port 按需调整
command=/opt/taizhang/venv/bin/python -m uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 1

; 【必改】运行用户（不要用 root）
user=taizhang

; 进程管理
autostart=true                ; supervisord 启动时自动拉起
autorestart=true              ; 异常退出自动重启
startsecs=5                   ; 启动 5 秒后仍存活视为成功
startretries=3                ; 启动失败重试次数
stopasgroup=true              ; 停止时杀掉整个进程组（含 uvicorn 子进程）
killasgroup=true
stopwaitsecs=10               ; 优雅停止等待时间（SQLite 写库收尾）

; 日志（stderr 合并进 stdout，按 20MB 滚动保留 10 份）
redirect_stderr=true
stdout_logfile=/var/log/taizhang/app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10

; 运行环境：关闭输出缓冲、保证中文日志不乱码、固定时区
environment=PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",TZ="Asia/Shanghai"


