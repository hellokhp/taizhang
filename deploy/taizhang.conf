; ================================================================
; 亚德彩投标台账 · FastAPI 后端 Supervisor 配置（Linux 生产环境）
; 数据库：PostgreSQL（库 yadecai）；文件实体：STORAGE_ROOT
;
; 安装：
;   1. 按实际情况修改下方【必改】标记的 4 处：项目路径 / Python 路径 / 运行用户 / 端口
;   2. 在两个 program 的 environment 里填好 PG_* / REDIS_URL / 各类密钥（见下方说明）
;   3. sudo cp taizhang.conf /etc/supervisor/conf.d/taizhang.conf
;      （CentOS/RHEL 为 /etc/supervisord.d/taizhang.ini）
;   4. sudo mkdir -p /var/log/taizhang && sudo chown -R taizhang:taizhang /var/log/taizhang
;   5. sudo supervisorctl reread && sudo supervisorctl update
;   6. sudo supervisorctl status taizhang      # 应显示 RUNNING
;
; 注意：
;   - 当前保持单进程（--workers 1）：数据库已是 PostgreSQL，但 server/main.py 仍有
;     进程内全局 RLock（fs.py / ai_summary_api.py 共用同一把），多 worker 会让这把锁
;     失效并导致并发写冲突。待《平台卡死治理与故障隔离方案 v2.0》§6.1 移除全局锁后，
;     方可启用多 worker 或按域拆进程（见该方案 §7）。
;   - PG 连接：主进程未显式配置时走 server/main.py 的默认值（127.0.0.1:5432 / yadecai）。
;     部署时请在 [program:taizhang] 的 environment 补齐
;     PG_HOST / PG_PORT / PG_USER / PG_PASSWORD / PG_DB，并与 AI Worker 段逐项保持一致。
;     会话已存 PG sessions 表，多进程不会掉登录，但去锁前不要放开 --workers。
;   - 默认只监听 127.0.0.1，前端静态文件与对外入口由 Nginx 托管/反代（见文件末尾注释）。
;     若不用 Nginx、需内网直连 8000 端口，把 --host 改为 0.0.0.0 即可
;     （代码内置 SPA 兜底，直连时刷新页面不 404）。
;   - 运行用户需能读取 server/users.json（启动时同步账号进 PG）；业务数据存 PostgreSQL，
;     文件实体存 STORAGE_ROOT，二者都不在 server/ 目录内：
;       sudo chown -R taizhang:taizhang /opt/taizhang/server
;       sudo mkdir -p /var/lib/taizhang/storage && sudo chown -R taizhang:taizhang /var/lib/taizhang/storage
; ================================================================

[program:taizhang]
; 【必改】项目根目录（server/ 的上级目录，uvicorn 以 server.main:app 模块方式加载）
directory=/opt/taizhang

; 【必改】虚拟环境 Python 路径；--host/--port 按需调整
command=/opt/taizhang/venv/bin/python -m uvicorn server.main:app --host 127.0.0.1 --port 8000 --workers 1

; 【必改】运行用户（不要用 root）
user=taizhang

; 进程管理
autostart=true                ; supervisord 启动时自动拉起
autorestart=true              ; 异常退出自动重启
startsecs=5                   ; 启动 5 秒后仍存活视为成功
startretries=3                ; 启动失败重试次数
stopasgroup=true              ; 停止时杀掉整个进程组（含 uvicorn 子进程）
killasgroup=true
stopwaitsecs=10               ; 优雅停止等待时间（PG 事务收尾）

; 日志（stderr 合并进 stdout，按 20MB 滚动保留 10 份）
redirect_stderr=true
stdout_logfile=/var/log/taizhang/app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10

; 运行环境：关闭输出缓冲、保证中文日志不乱码、固定时区
; PYTHONUTF8 / STORAGE_ROOT：文件存储模块用（存储根目录、备份保留天数）
; PG_HOST/PG_PORT/PG_USER/PG_PASSWORD/PG_DB：PostgreSQL 连接；未显式配置时走代码默认值，
;   生产必须显式填写，且须与 [program:taizhang-ai-worker] 的 PG_* 逐项一致。
; 可选调优（server/guard.py）：SLOW_REQUEST_MS=1000 慢请求告警阈值(ms)，
;   HEAVY_CONCURRENCY=2 台账导入/清空/文件合并的并发上限，超出返回 429，
;   LOCK_WAIT_SECONDS=3 全局锁等待上限，超时返回 503 而不是无限排队。
; 注意：这三个参数都依赖进程内状态，当前 --workers 1 才成立；拆进程前须换成 PG/Redis 实现。
; ONLYOFFICE 在线预览/编辑（可选，不用则整段删掉；改完 supervisorctl restart）：
;   OFFICE_SERVER   — 浏览器访问 DS 的地址，用内网 IP 或域名，别写 127.0.0.1（局域网用户会打不开）
;   OFFICE_SECRET   — 必须与 DS 容器 JWT_SECRET 逐字符一致，否则编辑器拒绝加载
;   OFFICE_BASE_URL — DS 容器回源取文件的地址，用「宿主机内网 IP:8000」；
;                     容器里的 127.0.0.1 是容器自己，必然失败；端口不能省
environment=PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",PYTHONUTF8="1",TZ="Asia/Shanghai",\
            STORAGE_ROOT="/var/lib/taizhang/storage",FS_RETENTION_DAYS="7",\
            OFFICE_SERVER="http://192.168.1.10:8888",OFFICE_SECRET="CHANGE_ME_SAME_AS_DS",\
            OFFICE_BASE_URL="http://192.168.1.10:8000"


; ================================================================
; 开标汇总 AI Worker（独立进程，不占用 3.8 后端主进程）
; 前置：部署机需装 Python 3.10+（AI 依赖 pdfplumber/python-docx 等在 3.8 装不上），
;       并在 ai-venv 里 pip install -r server/ai_worker/requirements.txt
; 本机开发实测：AI 工具自带 .venv 为 Python 3.10.5；如需 3.13 单独建 venv 亦可，
;       版本只要 >=3.10 即可，与后端 3.8 保持进程隔离是唯一硬要求。
; 启动顺序无依赖：Worker 会读 server/ai_schema.sql 幂等建 ai_* 表并 seed 提示词，
;       后端启动时也会执行同一份 DDL（该文件是全库 DDL 唯一事实源，必须随代码发布）。
;       Worker 用 %s 占位符，后端 PgDB 用 ? 占位符，两套 SQL 绝不混用。
; ================================================================
[program:taizhang-ai-worker]
directory=/opt/taizhang
; 【必改】AI 专用虚拟环境（与上面的 3.8 venv 不是同一个）
command=/opt/taizhang/ai-venv/bin/python -m server.ai_worker.worker
user=taizhang
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/taizhang/ai-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
; 密钥只放在 supervisor environment 或 KMS，不进代码库、不进 .env 提交；模板内一律占位符。
; REDIS_URL 含密码；Redis 未就绪时 Worker 自动降级为 3 秒轮询，不会启动失败。
; PG_* 必须与 [program:taizhang] 指向同一个库，否则任务与结果会分家。
environment=PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",PYTHONUTF8="1",TZ="Asia/Shanghai",\
            PG_HOST="127.0.0.1",PG_PORT="5432",PG_USER="postgres",PG_PASSWORD="CHANGE_ME",PG_DB="yadecai",\
            STORAGE_ROOT="/var/lib/taizhang/storage",\
            REDIS_URL="redis://:CHANGE_ME@127.0.0.1:6379/3",\
            LLM_PROVIDER="dashscope",\
            DASHSCOPE_API_KEY="CHANGE_ME_DASHSCOPE_API_KEY",\
            DASHSCOPE_BASE_URL="https://dashscope.aliyuncs.com/compatible-mode/v1",\
            AI_WORKER_ID="w1",AI_CONCURRENCY="6"
; 模型供应商切换：改 LLM_PROVIDER 即可（dashscope=千问 | deepseek | openai | workbuddy | 自定义名）。
;   - DeepSeek 为纯文本，无视觉能力；公示截图/扫描转写需另加一行 LLM_VISION_PROVIDER="dashscope" 及 DASHSCOPE_API_KEY。
;   - WorkBuddy / 任意 OpenAI 兼容网关：设 LLM_PROVIDER="workbuddy" 并补 LLM_BASE_URL / LLM_API_KEY / LLM_TEXT_MODEL 三行。
;   - 详见 server/ai_worker/bidsummary/config.py 的 PROVIDERS 注册表与 .env.example。


