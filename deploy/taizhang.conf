; 文件存储实体目录（不放在 frontend/dist 下，避免被构建清空 / 被 SPA 兜底命中）：
;     sudo mkdir -p /var/lib/taizhang/storage
;     sudo chown -R taizhang:taizhang /var/lib/taizhang/storage
;     sudo chmod 750 /var/lib/taizhang/storage
; 备份时必须 DB（pg_dump）与 storage 目录一起备份，否则元数据与实体不一致。
; ================================================================
