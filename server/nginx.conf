# 亚德彩投标台账 · Nginx 生产配置
# ============================================================
# 架构：浏览器 -> Nginx(8080) -> 静态文件(frontend/dist/) + /api/ -> uvicorn(127.0.0.1:8000)
# 后端数据库：PostgreSQL（首次启动自动建表；账号由 server/users.json 同步进库）
# 另有独立进程：开标汇总 AI Worker（Python >= 3.10 venv），进度经
#   /api/ai-summary/tasks/{id}/stream 的 SSE 推送，必须保留长超时 + 关闭 proxy_buffering。
#
# 注意：
#   - 本文件为 Windows 开发 / 备用配置。Linux 生产请以 deploy/taizhang.conf 末尾的
#     Nginx 参考配置为准（含 SSE 专用 location：1900s + proxy_buffering off）。
#   - 平台卡死治理第 1 步已落地超时分级：普通 /api/ 60s、/api/fs/upload/ 单独 600s、
#     SSE /api/ai-summary/tasks/{id}/stream 单独 1900s + 关闭 proxy_buffering。
#     二期 design/finance 接入后再按方案 v2.0 §7.3 拆 upstream。
#   - Linux 生产的 deploy/taizhang.conf 末尾参考配置已同步为同一份超时分级。
#   - 当前后端仍须单进程（--workers 1）：main.py 的进程内全局 RLock 尚未移除。
#
# ---------- Windows 部署 ----------
# 0. 先构建前端：cd frontend && npm install && npm run build（产出 frontend/dist）
# 1. 下载 nginx for Windows（nginx.org/en/download.html），解压到 C:\nginx
# 2. 用本文件替换 C:\nginx\conf\nginx.conf（注意把下面 root 路径改成实际路径）
# 3. 启动后端：双击 server\start_api.bat（或注册为开机计划任务）
# 4. 启动 Nginx：cd C:\nginx && start nginx
#    重载配置：nginx -s reload ；停止：nginx -s stop
# 5. 内网同事访问：http://<本机IP>:8080/
#    （若打不开，检查 Windows 防火墙是否放行 8080 入站）
#
# ---------- Linux 部署 ----------
# 1. 把项目放到 /opt/taizhang，安装依赖：
#      pip install -r /opt/taizhang/server/requirements.txt
#    并构建前端：cd /opt/taizhang/frontend && npm install && npm run build
# 2. systemd 后端服务 /etc/systemd/system/taizhang-api.service：
#      [Unit]
#      Description=taizhang api
#      After=network.target
#      [Service]
#      WorkingDirectory=/opt/taizhang
#      ExecStart=/usr/bin/python3 -m uvicorn server.main:app --host 127.0.0.1 --port 8000
#      Restart=always
#      [Install]
#      WantedBy=multi-user.target
#    然后：systemctl enable --now taizhang-api
# 3. 把本文件 server 块复制进 /etc/nginx/conf.d/taizhang.conf（去掉 events/http 外层），
#    root 改为 /opt/taizhang/frontend/dist，然后 nginx -t && systemctl reload nginx
# ============================================================

worker_processes  1;
events { worker_connections 1024; }

http {
    include       mime.types;   # Linux 下改为 /etc/nginx/mime.types
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/html text/css application/javascript application/json;
    client_max_body_size 32m;    # 文件存储分片 16MB，留 2 倍余量；小于分片会导致 413

    server {
        listen       8080;
        server_name  _;

        # 前端静态文件（Vite 构建产物；Windows 路径用正斜杠；Linux 改为 /opt/taizhang/frontend/dist）
        root  D:/vscode项目/taizhang/frontend/dist;
        index index.html;

        # SPA history 路由：/manage、/users 刷新直达时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 开标汇总 SSE 实时进度：单独 location，长超时 + 关闭缓冲。
        # 正则 location 优先于前缀 location，必须放在 /api/ 兜底之前。
        location ~ ^/api/ai-summary/tasks/[0-9]+/stream$ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1900s;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
        }

        # 文件分片上传 / 大文件合并：保持 600s，且必须关闭请求体缓冲，
        # 否则 Nginx 先把整个请求落到磁盘，分片就失去意义且容易超时。
        location ~ ^/api/fs/upload/ {
            proxy_pass              http://127.0.0.1:8000;
            proxy_set_header        Host $host;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }

        # 台账导入 / 清空仍是请求内同步执行（第 2 步才异步化）：
        # 异步化前必须保留长超时，否则大导入会被 60s 掐成 504。
        location ~ ^/api/(merge|clear)$ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 普通 API：故障时不再长期占住连接（方案 v2.0 §7.3 一期）
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ONLYOFFICE 同域反代（可选）：想让浏览器只访问 8080 时用，
        # 同时把 OFFICE_SERVER 设为 http://<本机IP>:8080/office
        # 独立端口直连（http://127.0.0.1:8888）时这一段可以整块删掉
        location /office/ {
            proxy_pass         http://127.0.0.1:8888/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;   # 编辑器 WebSocket 必须
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 600s;
        }
    }
}
